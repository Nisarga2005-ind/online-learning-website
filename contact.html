<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | EduLearn</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Navigation Bar -->
<header>
    <nav class="navbar">
        <div class="logo">EduLearn</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>
</header>

<!-- Contact Section -->
<section class="register-section">

    <div class="form-container">

        <h2>Contact Us</h2>

        <p style="text-align:center; margin-bottom:25px;">
            We'd love to hear from you! Send us your queries or feedback.
        </p>

        <form id="contactForm">

            <label>Full Name</label>
            <input type="text" id="contactName" placeholder="Enter your full name">

            <label>Email Address</label>
            <input type="email" id="contactEmail" placeholder="Enter your email">

            <label>Subject</label>
            <input type="text" id="subject" placeholder="Enter subject">

            <label>Message</label>
            <textarea id="message" rows="6" placeholder="Write your message here..."></textarea>

            <button type="submit" class="btn">
                Send Message
            </button>

        </form>

    </div>

</section>

<!-- Footer -->
<footer>
    <p>© 2026 EduLearn | Online Learning Website</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
